<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1722" viewBox="0 0 1440 1722" role="img" aria-labelledby="title desc">
  <title id="title">Stack tecnológico del Chatbot EIT UDP</title>
  <desc id="desc">Lámina visual del stack del chatbot EIT UDP: frontend, embeddings y RAG, backend, base de datos y modelos de lenguaje.</desc>
  <defs>
